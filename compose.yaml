services:
  postgres:
    image: postgres:16-alpine
    container_name: sistema_catalogacao_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sistema_catalogacao
      POSTGRES_USER: catalogacao
      POSTGRES_PASSWORD: catalogacao
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogacao -d sistema_catalogacao"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
