services:
  postgres:
    image: postgres:16-alpine
    container_name: sistema_catalogacao_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sistema_catalogacao
      POSTGRES_USER: catalogacao
      POSTGRES_PASSWORD: catalogacao
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogacao -d sistema_catalogacao"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: sistema_catalogacao_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: catalogacao
      MINIO_ROOT_PASSWORD: catalogacao
    ports:
      # 9000 = API S3 (a aplicação e o navegador), 9001 = console web.
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cria o bucket e libera leitura anônima uma única vez; sai em seguida.
  # Leitura pública mantém `imagemUrl` sendo uma URL direta, como já era com
  # imagens externas — em produção troque por URL assinada.
  minio_init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: sistema_catalogacao_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 catalogacao catalogacao &&
      mc mb --ignore-existing local/catalogacao &&
      mc anonymous set download local/catalogacao
      "

volumes:
  postgres_data:
  minio_data:
